name: Bug report
description: Something in Moo does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A short report with the exact version is worth more than a long one.
        For a security problem, use the Security tab instead.

  - type: input
    id: version
    attributes:
      label: Moo version
      description: Settings, About shows it, or use the file name of the package you installed.
      placeholder: 1.0.4
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How you installed it
      options:
        - From the Chrome Web Store
        - From a release file
        - Built from source and loaded temporarily
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Chrome version
      placeholder: '131.0.6778.86'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what appeared instead.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or errors
      description: Drag images in, or paste anything from the browser console.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem
          required: true

name: Manual Chrome release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag, such as v1.2.3
        required: true
        type: string
      publish:
        description: Publish immediately (otherwise create a draft)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: chrome-release
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.1'
      - name: Check version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build:chrome
      - run: node scripts/validateChrome.cjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--verify-tag --title "Moo $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md)
          if [[ "$PUBLISH" != true ]]; then args+=(--draft); fi
          gh release create "$RELEASE_TAG" build/chrome-*.zip "${args[@]}"
